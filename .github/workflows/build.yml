name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux x64
          - os: macos-14
            platform: macOS universal
          - os: windows-2022
            platform: Windows x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDKs
        shell: bash
        run: |
          mkdir -p external
          git clone --depth 1 https://github.com/free-audio/clap.git external/clap
          git clone --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxtst-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Artifacts are named for humans here, before upload, so release assets
      # never carry toolchain default names.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="$(git rev-parse --short HEAD)" ;; esac
          stage="vst3-to-clap - ${{ matrix.platform }} v${version}"
          mkdir -p "dist/$stage"
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp build/Release/vst3-to-clap.exe build/Release/vst3-to-clap-wrapper.clap "dist/$stage/"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp build/vst3-to-clap "dist/$stage/"
            cp -R build/vst3-to-clap-wrapper.clap "dist/$stage/"
          else
            cp build/vst3-to-clap build/vst3-to-clap-wrapper.clap "dist/$stage/"
          fi
          cp README.md LICENSE "dist/$stage/"
          # Git Bash on the Windows runner has no `zip`; 7-Zip is preinstalled.
          # Elsewhere `zip` is used so the executable bit survives.
          if [ "$RUNNER_OS" == "Windows" ]; then
            (cd dist && 7z a -tzip -bso0 "${stage}.zip" "$stage")
          else
            (cd dist && zip -qr "${stage}.zip" "$stage")
          fi
          echo "ASSET=dist/${stage}.zip" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${stage}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
